server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 引入 nginx 默认 MIME 类型，然后补充 wasm
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # 启用 gzip 压缩。
    # 注意：不要压缩 wasm——wasm 本身已是二进制，压缩收益极小，
    # 反而让浏览器多一次 ~32MB 解压的内存峰值，手机端尤其容易因此加载失败。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json;

    # 关键：单线程 FFmpeg.wasm core（@ffmpeg/core@0.12.6）不需要 SharedArrayBuffer，
    # 因此绝不能给响应加 COOP/COEP 头——一旦主文档进入 cross-origin isolation，
    # 会破坏 blob URL 加载，导致「FFmpeg 加载失败 / Load failed」。
    # 只有将来换多线程 core（@ffmpeg/core-mt）时才需要这两个头。

    # 静态资源缓存策略
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FFmpeg core 文件（.wasm / .js）长期缓存
    location ~* \.(wasm|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 图片/字体/样式等静态资源长期缓存
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # html 不缓存，更新后立即生效（避免浏览器缓存旧版页面）
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
